port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  use-system-hosts: false

  # 如果要让局域网设备 / WSL / Docker 使用 Mihomo DNS，保留 0.0.0.0
  listen: 127.0.0.1:1053

  # DNS 遵循 Clash 规则
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # DNS 缓存
  cache-algorithm: arc

  # 不主动优先使用 HTTP/3
  prefer-h3: false

  fake-ip-filter:
    # 局域网
    - +.lan
    - +.local

    # 反向 DNS
    - +.in-addr.arpa
    - +.ip6.arpa

    # Windows 网络检测
    - +.msftconnecttest.com
    - +.msftncsi.com

    # QQ / 微信
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - localhost.work.weixin.qq.com

    # STUN
    - stun.*.*.*
    - stun.*.*

    # NTP / 时间同步
    - time.windows.com
    - time.nist.gov
    - time.apple.com
    - time.asia.apple.com
    - time1.apple.com
    - time2.apple.com
    - time3.apple.com
    - time4.apple.com
    - time5.apple.com
    - time6.apple.com
    - time7.apple.com

    - pool.ntp.org
    - ntp.ubuntu.com
    - ntp.aliyun.com
    - ntp1.aliyun.com
    - ntp2.aliyun.com
    - ntp3.aliyun.com
    - ntp4.aliyun.com
    - ntp5.aliyun.com
    - ntp6.aliyun.com
    - ntp7.aliyun.com

    - time1.aliyun.com
    - time2.aliyun.com
    - time3.aliyun.com
    - time4.aliyun.com
    - time5.aliyun.com
    - time6.aliyun.com
    - time7.aliyun.com

    - +.ntp.org.cn
    - +.openwrt.pool.ntp.org
    - +.time.edu.cn
    - time.ustc.edu.cn
    - time1.cloud.tencent.com

    # 游戏网络相关
    - "*.*.*.srv.nintendo.net"
    - "*.*.stun.playstation.net"
    - xbox.*.*.microsoft.com
    - +.ipv6.microsoft.com
    - "*.*.xboxlive.com"
    - speedtest.cros.wr.pvp.net

  # 用于解析 DNS 服务器自身域名
  default-nameserver:
    - 223.5.5.5
    - 180.76.76.76
    - 182.254.118.118
    - 1.2.4.8
    - 8.8.8.8

  # 普通 DNS
  nameserver:
    # 国内
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

    # 国外
    - https://1.1.1.1/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://8.8.4.4/dns-query
    - https://208.67.222.222/dns-query

  # 代理节点域名解析
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  # DIRECT 域名解析
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  # 国内 / 私有域名使用国内 DNS
  nameserver-policy:
    "geosite:private,cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

  # 防止国内 DNS 对国外域名返回异常结果
  fallback-filter:
    geoip: true

    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32

    domain:
      - +.google.com
      - +.googleapis.com
      - +.googleapis.cn
      - +.gvt1.com
      - +.youtube.com
      - +.facebook.com
      - +.twitter.com
      - +.x.com
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
rules:
  #禁用 WebRTC
  - DST-PORT,3478,REJECT-DROP
  - DST-PORT,5349,REJECT-DROP
  - DST-PORT,19302-19309,REJECT-DROP
  - DOMAIN-KEYWORD,stun,REJECT-DROP
  # 时间校对
  - DOMAIN-SUFFIX,time.windows.com,DIRECT
  # cn直连
  - DOMAIN-SUFFIX,cn,DIRECT
  # Microsoft（优化）
  - GEOSITE,bing,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  # - GEOSITE,microsoft,默认
  # Steam（优化）
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,默认
  # 国外服务
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,google-deepmind,大模型
  - GEOSITE,category-ai-!cn,大模型
  - GEOSITE,category-anticensorship,默认
  - GEOSITE,category-social-media-!cn,默认
  # 国外IP
  - GEOIP,telegram,默认,no-resolve
  - GEOIP,cloudflare,默认,no-resolve
  - GEOIP,facebook,默认,no-resolve
  - GEOIP,google,默认,no-resolve
  - GEOIP,netflix,默认,no-resolve
  - GEOIP,twitter,默认,no-resolve
  # 国外网址
  - GEOSITE,spotify,默认
  - GEOSITE,github,默认
  - GEOSITE,discord,默认
  - GEOSITE,telegram,默认
  - GEOSITE,twitter,默认
  - GEOSITE,google,默认
  - GEOSITE,wikimedia,默认
  - GEOSITE,linuxdo,默认
  - GEOSITE,tiktok,默认
  # 国外软件
  - GEOSITE,jetbrains,DIRECT
  - GEOSITE,docker,DIRECT
  # 国内服务
  - GEOSITE,category-dev-cn,DIRECT
  - GEOSITE,tencent,DIRECT
  - GEOSITE,baidu,DIRECT
  - GEOSITE,alibaba,DIRECT
  - GEOSITE,bytedance,DIRECT
  - GEOSITE,kingsoft,DIRECT
  - GEOSITE,bilibili,DIRECT
  - GEOSITE,xiaomi,DIRECT
  - GEOSITE,category-social-media-cn,DIRECT
  - GEOSITE,category-entertainment-cn,DIRECT
  - GEOSITE,geolocation-cn,DIRECT
  # 中国兜底
  - GEOIP,lan,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  # - GEOSITE,cn,DIRECT
  # 最终兜底
  - MATCH,其他
proxy-groups:
  - name: 默认
    type: select
    proxies:
      - DIRECT
    include-all-providers: true
    icon: https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/relay.png
    hidden: false
  - name: 大模型
    type: select
    proxies:
      - REJECT
    include-all-providers: true
    icon: https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/anthropic.png
    hidden: false
  - name: 其他
    type: select
    proxies:
      - DIRECT
    include-all-providers: true
    icon: https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/loadbalance.png
    hidden: false
proxy-providers:
  airport-1:
    type: http
    url: "https://airport-1.com/api/v1/client/subscribe?token=xxxx"
    path: ./proxy_providers/airport-1.yaml
    interval: 86400
    filter: "^(?!.*(官网|套餐|流量|异常|剩余)).*$"
    healthCheck:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
